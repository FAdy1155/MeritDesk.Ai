# Optional local/self-hosted run of the two production images.
# Database, Clerk, Stripe, S3, SES and Anthropic stay as managed services
# (see DEPLOYMENT.md). Copy .env.example to .env.local first.
#
#   docker compose build --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
#   docker compose up
#
# Fly.io remains the documented production host. This file is for a Linux
# Docker host when you are not using Fly, or for a staging box.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    env_file: .env.local
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env.local
    environment:
      NODE_ENV: production
      UNTRUSTED_TOOLS_SANDBOX: required