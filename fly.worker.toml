# Background job worker — no public port, so no [http_service] block. This
# consumes the "skill-run" and "document-ingest" pg-boss queues (see
# src/worker.ts) and runs document processing and background jobs.
app = "meritdesk-ai-worker"
primary_region = "iad"

# Graceful shutdown on deploys and restarts.
kill_signal = "SIGTERM"
kill_timeout = 120
swap_size_mb = 1024

[build]
  dockerfile = "Dockerfile.worker"

# Concurrency is deliberately capped for the 2-CPU organization limit.
[env]
  SKILL_RUN_CONCURRENCY = "2"
  DOCUMENT_INGEST_CONCURRENCY = "1"
  LIBREOFFICE_CONCURRENCY = "1"
  MALWARE_SCAN_CONCURRENCY = "1"
  NODE_OPTIONS = "--max-old-space-size=1536"
  LIBRARY_DAILY_CONCURRENCY = "2"
  LIBRARY_BACKFILL_CONCURRENCY = "1"
  LIBRARY_PDF_CONCURRENCY = "1"
  LIBRARY_PDF_MEMORY_MB = "512"

# Apply migrations and seed skills before starting this version's machines.
[deploy]
  release_command = "npm run release"

# No public service. Keep one always-on worker machine after first deploy.

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
