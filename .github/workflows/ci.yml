# Checks every push and pull request: typecheck, lint, environment contract and production build.
# Uses synthetic placeholders only; no real credentials or customer data are used.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://build:build@localhost/build
      QUEUE_DATABASE_URL: postgresql://build:build@localhost/build
      ANTHROPIC_API_KEY: sk-ant-build-placeholder
      CLERK_SECRET_KEY: sk_test_build_placeholder
      CLERK_WEBHOOK_SECRET: whsec_build_placeholder
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jb20k
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: build-placeholder
      AWS_SECRET_ACCESS_KEY: build-placeholder
      S3_DOCUMENTS_BUCKET: build-placeholder
      CONNECTOR_PUBLIC_ORIGIN: https://app.example.com
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate environment variable documentation
        run: npm run env:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
