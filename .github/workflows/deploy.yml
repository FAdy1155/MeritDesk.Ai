# Deploy worker first so database migrations complete before the web app is released.
# App-scoped deploy tokens are used directly for their respective deployments.
name: Deploy to Fly.io

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WORKER_APP: ${{ vars.FLY_WORKER_APP }}
      WEB_APP: ${{ vars.FLY_WEB_APP }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check deployment settings
        env:
          FLY_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          missing=""
          [ -n "$FLY_TOKEN" ] || missing="$missing FLY_API_TOKEN(secret)"
          [ -n "$WORKER_APP" ] || missing="$missing FLY_WORKER_APP"
          [ -n "$WEB_APP" ] || missing="$missing FLY_WEB_APP"
          [ -n "$CLERK_PUBLISHABLE_KEY" ] || missing="$missing NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
          if [ -n "$missing" ]; then
            echo "Missing GitHub repository settings:$missing"
            exit 1
          fi
          case "$FLY_TOKEN" in
            "FlyV1 "*) echo "Fly token format is present" ;;
            *) echo "FLY_API_TOKEN must be the complete FlyV1 token from flyctl tokens create org"; exit 1 ;;
          esac

      - name: Deploy worker and run database migrations
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --remote-only --config fly.worker.toml --app "$WORKER_APP"

      - name: Deploy web app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --remote-only --config fly.toml --app "$WEB_APP" \
            --build-arg "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$CLERK_PUBLISHABLE_KEY"
