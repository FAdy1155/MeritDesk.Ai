# Deploys both Fly.io apps when you press "Run workflow" on the Actions tab.
# Worker first: its release command runs the database migrations and seeds the
# skills before either app's new code serves traffic (README section 4).
#
# Needs, in the GitHub repository settings (Settings > Secrets and variables >
# Actions):
#   Secret   FLY_API_TOKEN                       from `fly tokens create deploy`
#   Variable FLY_WEB_APP                         the web app's Fly name
#   Variable FLY_WORKER_APP                      the worker app's Fly name
#   Variable NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY   Clerk's publishable key (public by design)
# The app's real secrets (database, Clerk secret key, AWS, Anthropic, API keys)
# are set on Fly with `fly secrets set`, never in GitHub (DEPLOY.md step 6).
name: Deploy to Fly.io

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Check settings
        run: |
          missing=""
          [ -n "$FLY_API_TOKEN" ] || missing="$missing FLY_API_TOKEN(secret)"
          [ -n "${{ vars.FLY_WEB_APP }}" ] || missing="$missing FLY_WEB_APP"
          [ -n "${{ vars.FLY_WORKER_APP }}" ] || missing="$missing FLY_WORKER_APP"
          [ -n "${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" ] || missing="$missing NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
          if [ -n "$missing" ]; then echo "Missing repository settings:$missing"; exit 1; fi
      - name: Deploy worker (runs migrations first)
        run: flyctl deploy --remote-only -c fly.worker.toml -a "${{ vars.FLY_WORKER_APP }}"
      - name: Deploy web app
        run: >
          flyctl deploy --remote-only -c fly.toml -a "${{ vars.FLY_WEB_APP }}"
          --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}"
