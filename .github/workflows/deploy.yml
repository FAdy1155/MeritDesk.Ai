# Build images on GitHub-hosted runners and authenticate to each Fly app
# with its own app-scoped deploy token. Deploy worker first so migrations run
# before the web app is released.
name: Deploy to Fly.io

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WORKER_APP: ${{ vars.FLY_WORKER_APP }}
      WEB_APP: ${{ vars.FLY_WEB_APP }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check deployment settings
        shell: bash
        env:
          WORKER_TOKEN: ${{ secrets.FLY_WORKER_API_TOKEN }}
          WEB_TOKEN: ${{ secrets.FLY_WEB_API_TOKEN }}
        run: |
          missing=""
          [ -n "$WORKER_TOKEN" ] || missing="$missing FLY_WORKER_API_TOKEN(secret)"
          [ -n "$WEB_TOKEN" ] || missing="$missing FLY_WEB_API_TOKEN(secret)"
          [ -n "$WORKER_APP" ] || missing="$missing FLY_WORKER_APP"
          [ -n "$WEB_APP" ] || missing="$missing FLY_WEB_APP"
          [ -n "$CLERK_PUBLISHABLE_KEY" ] || missing="$missing NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
          if [ -n "$missing" ]; then
            echo "Missing GitHub repository settings:$missing"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate Docker for worker app
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_WORKER_API_TOKEN }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/amd64
          push: true
          tags: registry.fly.io/${{ vars.FLY_WORKER_APP }}:${{ github.sha }}

      - name: Deploy worker and run database migrations
        run: >-
          flyctl deploy
          --config fly.worker.toml
          --app "${{ vars.FLY_WORKER_APP }}"
          --image "registry.fly.io/${{ vars.FLY_WORKER_APP }}:${{ github.sha }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_WORKER_API_TOKEN }}

      - name: Authenticate Docker for web app
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_WEB_API_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          tags: registry.fly.io/${{ vars.FLY_WEB_APP }}:${{ github.sha }}

      - name: Deploy web app
        run: >-
          flyctl deploy
          --config fly.toml
          --app "${{ vars.FLY_WEB_APP }}"
          --image "registry.fly.io/${{ vars.FLY_WEB_APP }}:${{ github.sha }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_WEB_API_TOKEN }}
